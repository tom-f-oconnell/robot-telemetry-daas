name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rtdaas-api
            dockerfile: infra/docker/api.Dockerfile
          - image: rtdaas-spark
            dockerfile: infra/docker/spark.Dockerfile
          - image: rtdaas-airflow
            dockerfile: infra/docker/airflow.Dockerfile
          - image: rtdaas-sim
            dockerfile: infra/docker/sim.Dockerfile
          - image: rtdaas-bridge
            dockerfile: infra/docker/bridge.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        continue-on-error: true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Rebuild without cache to surface the failing step as annotations
        if: steps.build.outcome == 'failure'
        run: >
          bash scripts/ci-annotate.sh "docker build ${{ matrix.image }}" --
          docker build --progress=plain -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:debug .
