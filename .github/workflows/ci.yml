name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: bash scripts/ci-annotate.sh "ruff check" -- ruff check --output-format=concise rtdaas tests
      - run: bash scripts/ci-annotate.sh "ruff format" -- ruff format --check --diff rtdaas tests

  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libs for opencv-python-headless
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -e ".[dev,video,api]"
      - name: Pure-Python unit tests (no cluster)
        run: >
          bash scripts/ci-annotate.sh "unit tests" --
          pytest -m "not spark and not airflow and not integration" -ra --tb=short
          --cov=rtdaas --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Generated contracts are up to date
        run: python -m rtdaas.contracts.cli gen && git diff --exit-code -- contracts/avro
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  spark:
    name: spark (pyspark 3.5)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libs for opencv-python-headless
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -e ".[spark,dev]"
      - name: Spark-marked tests (local SparkSession)
        env:
          RTDAAS_SPARK_PACKAGES: "0"
          SPARK_LOCAL_IP: 127.0.0.1
        run: bash scripts/ci-annotate.sh "spark tests" -- pytest -m spark -ra --tb=short -p no:cacheprovider

  airflow:
    name: airflow (DAG integrity)
    runs-on: ubuntu-latest
    needs: [unit]
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__UNIT_TEST_MODE: "true"
      AIRFLOW_VAR_RTDAAS_SPARK_MODE: submit
      AIRFLOW_VAR_RTDAAS_HOME: ${{ github.workspace }}
      AIRFLOW_VAR_RTDAAS_QUALITY_CHECKS_DIR: ${{ github.workspace }}/quality/checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Airflow with the official constraints
        run: >
          pip install "apache-airflow==2.10.3"
          apache-airflow-providers-amazon apache-airflow-providers-apache-spark
          apache-airflow-providers-cncf-kubernetes apache-airflow-providers-elasticsearch
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.11.txt"
      - run: pip install -e ".[dev]"
      - run: airflow db migrate
      - name: DAG import + structure tests
        run: bash scripts/ci-annotate.sh "airflow tests" -- pytest -m airflow -ra --tb=short -p no:cacheprovider

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
