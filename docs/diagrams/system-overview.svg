<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <title>rtdaas system overview</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .gray  rect { fill:#F1EFE8; stroke:#888780; }
      .gray  .t  { fill:#2C2C2A; } .gray .s { fill:#5F5E5A; }
      .purp  rect { fill:#EEEDFE; stroke:#7F77DD; }
      .purp  .t  { fill:#26215C; } .purp .s { fill:#534AB7; }
      .teal  rect { fill:#E1F5EE; stroke:#1D9E75; }
      .teal  .t  { fill:#04342C; } .teal .s { fill:#0F6E56; }
      rect { stroke-width:1; rx:8; }
      .t { font-weight:600; }
      .s { font-size:12px; }
      .h { fill:#5F5E5A; font-size:12px; font-weight:600; letter-spacing:.02em; }
      line { stroke:#5F5E5A; stroke-width:1.2; fill:none; marker-end:url(#arr); }
      .lg { fill:#5F5E5A; font-size:11px; }
    </style>
  </defs>

  <text class="h" x="170" y="32" text-anchor="middle">REAL-TIME PATH</text>
  <text class="h" x="450" y="32" text-anchor="middle">MICRO-BATCH: BAGS</text>
  <text class="h" x="730" y="32" text-anchor="middle">MICRO-BATCH: JIGSAWS</text>

  <g class="gray">
    <rect x="40" y="50" width="260" height="60"/>
    <text class="t" x="170" y="75" text-anchor="middle">dVRK simulated robots (ROS 2)</text>
    <text class="s" x="170" y="94" text-anchor="middle">joint states · tool pose · events · heartbeat</text>
    <rect x="320" y="50" width="260" height="60"/>
    <text class="t" x="450" y="75" text-anchor="middle">Recorded bags (MCAP)</text>
    <text class="s" x="450" y="94" text-anchor="middle">cdr + ros2msg, landed in S3 / MinIO</text>
    <rect x="600" y="50" width="260" height="60"/>
    <text class="t" x="730" y="75" text-anchor="middle">JIGSAWS dataset</text>
    <text class="s" x="730" y="94" text-anchor="middle">76-var kinematics @ 30 Hz + video</text>
  </g>

  <g class="purp">
    <rect x="40" y="140" width="260" height="60"/>
    <text class="t" x="170" y="165" text-anchor="middle">rtdaas_kafka_bridge (C++)</text>
    <text class="s" x="170" y="184" text-anchor="middle">rosidl introspection → Avro (registry schema)</text>
    <rect x="320" y="140" width="540" height="60"/>
    <text class="t" x="590" y="165" text-anchor="middle">Airflow DAGs</text>
    <text class="s" x="590" y="184" text-anchor="middle">S3 sensors · dynamic backfills · daily DQ · contracts sync</text>
  </g>

  <g class="purp">
    <rect x="40" y="230" width="260" height="60"/>
    <text class="t" x="170" y="255" text-anchor="middle">Kafka (KRaft) + schema registry</text>
    <text class="s" x="170" y="274" text-anchor="middle">4 topics · key = robot_id · BACKWARD compat</text>
    <rect x="320" y="230" width="260" height="60"/>
    <text class="t" x="450" y="255" text-anchor="middle">Spark batch: batch_mcap</text>
    <text class="s" x="450" y="274" text-anchor="middle">decode_bag (Python) → raw → sessions</text>
    <rect x="600" y="230" width="260" height="60"/>
    <text class="t" x="730" y="255" text-anchor="middle">Spark batch: batch_jigsaws</text>
    <text class="s" x="730" y="274" text-anchor="middle">frames ⟷ kinematics → gesture metrics</text>
  </g>

  <g class="purp">
    <rect x="40" y="320" width="260" height="60"/>
    <text class="t" x="170" y="345" text-anchor="middle">Spark Structured Streaming</text>
    <text class="s" x="170" y="364" text-anchor="middle">1-min KPIs per robot × arm, anomaly flags</text>
    <rect x="320" y="320" width="540" height="60"/>
    <text class="t" x="590" y="345" text-anchor="middle">Quality gate → publish</text>
    <text class="s" x="590" y="364" text-anchor="middle">YAML check suites · blocking failures stop the DAG · dq.check_results</text>
  </g>

  <g class="teal">
    <rect x="40" y="420" width="260" height="60"/>
    <text class="t" x="170" y="445" text-anchor="middle">Elasticsearch</text>
    <text class="s" x="170" y="464" text-anchor="middle">events · KPIs · sessions · gesture search</text>
    <rect x="320" y="420" width="260" height="60"/>
    <text class="t" x="450" y="445" text-anchor="middle">Iceberg lakehouse</text>
    <text class="s" x="450" y="464" text-anchor="middle">MinIO / S3 · REST catalog · MERGE</text>
    <rect x="600" y="420" width="260" height="60"/>
    <text class="t" x="730" y="445" text-anchor="middle">Snowflake marts</text>
    <text class="s" x="730" y="464" text-anchor="middle">COPY INTO from Parquet · DuckDB fallback</text>
  </g>

  <g class="teal">
    <rect x="200" y="520" width="500" height="60"/>
    <text class="t" x="450" y="545" text-anchor="middle">Data API (Starlette, OpenAPI) + Web UI</text>
    <text class="s" x="450" y="564" text-anchor="middle">sessions · trajectory replay · log explorer · trials · synced video · catalog · DQ · reprocess</text>
  </g>

  <g class="gray">
    <rect x="40" y="610" width="820" height="50"/>
    <text class="t" x="450" y="631" text-anchor="middle">Platform</text>
    <text class="s" x="450" y="649" text-anchor="middle">Terraform (libvirt / AWS) · Ansible · k3s · Argo CD app-of-apps · GitHub Actions (ci · contracts · images · integration · deploy)</text>
  </g>

  <line x1="170" y1="110" x2="170" y2="138"/>
  <line x1="450" y1="110" x2="450" y2="138"/>
  <line x1="730" y1="110" x2="730" y2="138"/>
  <line x1="170" y1="200" x2="170" y2="228"/>
  <line x1="450" y1="200" x2="450" y2="228"/>
  <line x1="730" y1="200" x2="730" y2="228"/>
  <line x1="170" y1="290" x2="170" y2="318"/>
  <line x1="450" y1="290" x2="450" y2="318"/>
  <line x1="730" y1="290" x2="730" y2="318"/>
  <line x1="120" y1="380" x2="120" y2="418"/>
  <line x1="230" y1="380" x2="400" y2="418"/>
  <line x1="360" y1="380" x2="240" y2="418"/>
  <line x1="500" y1="380" x2="470" y2="418"/>
  <line x1="730" y1="380" x2="730" y2="418"/>
  <line x1="170" y1="480" x2="290" y2="518"/>
  <line x1="450" y1="480" x2="450" y2="518"/>
  <line x1="730" y1="480" x2="610" y2="518"/>

  <text class="lg" x="450" y="690" text-anchor="middle">Gray: sources and platform · Purple: pipeline · Teal: storage and access. Arrows are data flow; the UI's reprocess button calls Airflow's REST API.</text>
</svg>
