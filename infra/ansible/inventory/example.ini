# Example static inventory. Terraform writes the real one to inventory/hosts.ini.
[k3s_server]
rtdaas-node-01 ansible_host=10.42.100.10

[k3s_agent]
rtdaas-node-02 ansible_host=10.42.100.11
rtdaas-node-03 ansible_host=10.42.100.12
rtdaas-node-04 ansible_host=10.42.100.13

[k3s_cluster:children]
k3s_server
k3s_agent

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
