---
- name: Resolve server facts
  ansible.builtin.set_fact:
    k3s_server_host: "{{ groups['k3s_server'][0] }}"

- name: Fail if the server play did not export a token
  ansible.builtin.assert:
    that:
      - hostvars[k3s_server_host].k3s_node_token is defined
      - hostvars[k3s_server_host].k3s_server_url is defined
    fail_msg: "Run the k3s_server play first (site.yml does this)."

- name: Check whether k3s agent is already installed
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  when: k3s_installed.rc != 0 or k3s_version not in (k3s_installed.stdout | default(''))

- name: Install k3s agent
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "{{ hostvars[k3s_server_host].k3s_server_url }}"
    K3S_TOKEN: "{{ hostvars[k3s_server_host].k3s_node_token }}"
    INSTALL_K3S_EXEC: "agent {{ k3s_agent_args }} --node-ip {{ k3s_node_ip }} --node-external-ip {{ ansible_host }}"
  when: k3s_installed.rc != 0 or k3s_version not in (k3s_installed.stdout | default(''))
  changed_when: true

- name: Ensure k3s-agent service is running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started

- name: Wait for the agent to register as Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
  delegate_to: "{{ k3s_server_host }}"
  changed_when: false
  retries: 5
  delay: 10
  register: agent_ready
  until: agent_ready.rc == 0
