---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init
  changed_when: false
  failed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-apt
      - curl
      - ca-certificates
      - open-iscsi
      - nfs-common
      - jq
    state: present

- name: Enable iscsid (needed by CSI drivers such as Longhorn, harmless otherwise)
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Kernel parameters for Kafka / Elasticsearch / kubelet
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-rtdaas.conf
    reload: true
  loop:
    - { key: fs.inotify.max_user_instances, value: "8192" }
    - { key: fs.inotify.max_user_watches, value: "1048576" }
    - { key: vm.max_map_count, value: "262144" }
    - { key: net.ipv4.ip_forward, value: "1" }
    - { key: vm.swappiness, value: "0" }

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | default(0) | int > 0
  changed_when: true

- name: Remove swap entries from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load br_netfilter
  community.general.modprobe:
    name: br_netfilter
    state: present
    persistent: present
