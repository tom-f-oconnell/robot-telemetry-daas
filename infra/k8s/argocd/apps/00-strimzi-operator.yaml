apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: quay.io/strimzi-helm
    chart: strimzi-kafka-operator
    targetRevision: 0.43.0
    helm:
      releaseName: strimzi
      valuesObject:
        resources:
          requests: { cpu: 200m, memory: 384Mi }
          limits: { memory: 768Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  # The chart's CRDs carry `required: []`, which the API server drops: always OutOfSync otherwise.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .. | .required? | select(. == [])
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
