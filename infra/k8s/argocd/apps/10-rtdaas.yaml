apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rtdaas
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/<owner>/robot-telemetry-daas.git
    targetRevision: main
    path: infra/k8s/manifests/rtdaas
  destination:
    server: https://kubernetes.default.svc
    namespace: rtdaas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
