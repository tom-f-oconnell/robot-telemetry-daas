apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubeflow.github.io/spark-operator
      chart: spark-operator
      targetRevision: 2.0.2
      helm:
        releaseName: spark-operator
        valueFiles:
          - $values/infra/k8s/helm-values/spark-operator.yaml
    - repoURL: https://github.com/<owner>/robot-telemetry-daas.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: spark-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
