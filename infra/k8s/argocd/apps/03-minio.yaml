apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Plain manifests rather than the upstream Helm chart: MinIO's public images were withdrawn
  # in 2025, so the image is pinned in manifests/minio/minio.yaml (see the comment there).
  source:
    repoURL: https://github.com/tom-f-oconnell/robot-telemetry-daas.git
    targetRevision: main
    path: infra/k8s/manifests/minio
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
