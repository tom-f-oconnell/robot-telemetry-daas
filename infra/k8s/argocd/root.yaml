# App-of-apps: Argo CD watches infra/k8s/argocd/apps/ and creates one Application
# per file. Applied once by Ansible (roles/argocd); everything else is GitOps.
#
# TODO(owner): replace <owner> with your GitHub user/org (also in apps/*.yaml and
# helm-values/airflow.yaml). Image references in manifests/rtdaas/ use the
# placeholder OWNER (valid image syntax); .github/workflows/deploy.yml rewrites
# them with `kustomize edit set image` on every build of main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rtdaas-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tom-f-oconnell/robot-telemetry-daas.git
    targetRevision: main
    path: infra/k8s/argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
