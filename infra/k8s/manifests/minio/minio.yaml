# S3-compatible object store for the lake and the raw landing zone (local/libvirt environment;
# on AWS the env overlay points S3_ENDPOINT at real S3 and this app can be disabled).
#
# MinIO withdrew its public container images in 2025 (quay.io/minio/* and docker.io/minio/*
# no longer resolve), which also breaks the upstream Helm chart. This is therefore a plain
# Deployment with the image in ONE place. `bitnamilegacy/minio` is a frozen MinIO build that
# auto-creates buckets from MINIO_DEFAULT_BUCKETS; drop-in alternatives that resolve today:
#   rustfs/rustfs:latest        (MinIO-compatible successor; env RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY)
#   versity/versitygw:latest    (S3 gateway over POSIX)
# Keep the Service name/port: everything else addresses http://minio.minio.svc.cluster.local:9000.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin          # dev only — replace with a SealedSecret / ExternalSecret
  MINIO_ROOT_PASSWORD: minioadmin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: minio
          image: bitnamilegacy/minio:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: minio-root
          env:
            - name: MINIO_DEFAULT_BUCKETS
              value: "rtdaas-raw:none,rtdaas-lake:none"
            - name: MINIO_REGION
              value: us-east-1
            - name: MINIO_CONSOLE_PORT_NUMBER
              value: "9001"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
