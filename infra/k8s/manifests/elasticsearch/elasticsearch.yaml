# ECK-managed single-node Elasticsearch for the demo cluster.
# Service: http://rtdaas-es-http.rtdaas.svc.cluster.local:9200, plain HTTP and no credentials.
# Not xpack.security.enabled=false: ECK's file-based settings fail to load without security, and
# Elasticsearch stays unready. Anonymous superuser gives clients the same access.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: rtdaas
  namespace: rtdaas
spec:
  version: 8.15.3
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        xpack.security.authc.anonymous:
          username: anonymous
          roles: superuser
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: -Xms1g -Xmx1g
              resources:
                requests: { cpu: 500m, memory: 2Gi }
                limits: { memory: 2Gi }
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: rtdaas
  namespace: rtdaas
spec:
  version: 8.15.3
  count: 1
  elasticsearchRef:
    name: rtdaas
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  config:
    xpack.security.authc.providers:
      anonymous.anonymous1:
        order: 0
        credentials: elasticsearch_anonymous_user
      basic.basic1:
        order: 1
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 1Gi }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: rtdaas
spec:
  ingressClassName: nginx
  rules:
    - host: kibana.rtdaas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rtdaas-kb-http
                port:
                  number: 5601
