# Partition counts and retention mirror contracts/registry.yml (source of truth).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: rtdaas.telemetry.joint-states
  namespace: kafka
  labels:
    strimzi.io/cluster: rtdaas
spec:
  topicName: rtdaas.telemetry.joint_states
  partitions: 12
  replicas: 3
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
    compression.type: zstd
    min.insync.replicas: "2"
---
