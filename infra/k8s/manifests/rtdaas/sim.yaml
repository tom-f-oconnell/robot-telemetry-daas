# Demo load: ROS-less fleet simulator publishing Avro records to Kafka and writing
# MCAP bags under /data/bags (synced to s3://rtdaas-raw/bags by the sidecar so the
# batch path has input). Scale to 0 outside demos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtdaas-sim
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: rtdaas-sim
    app.kubernetes.io/part-of: rtdaas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rtdaas-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtdaas-sim
        app.kubernetes.io/part-of: rtdaas
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sim
          image: ghcr.io/OWNER/rtdaas-sim:latest
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --robots
            - "3"
            - --duration
            - "3600"
            - --rate
            - "50"
            - --kafka
            - --mcap-out
            - /data/bags
          envFrom:
            - configMapRef:
                name: rtdaas-config
            - configMapRef:
                name: rtdaas-env-overlay
                optional: true
            - secretRef:
                name: rtdaas-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: bags
              mountPath: /data
        # Lands closed bags in the raw bucket every minute (prefix layout per spec §3.1).
        - name: bag-lander
          image: ghcr.io/OWNER/rtdaas-sim:latest
          imagePullPolicy: IfNotPresent
          command: ["rtdaas-land"]
          args: ["--root", "/data/bags", "--watch", "--interval", "60"]
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: rtdaas-config
            - configMapRef:
                name: rtdaas-env-overlay
                optional: true
            - secretRef:
                name: rtdaas-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: bags
              mountPath: /data
      volumes:
        - name: bags
          emptyDir:
            sizeLimit: 10Gi
