# Shared /data volume for the API (SQLite mirror in sqlite mode, trial videos for
# /api/trials/{id}/video) and the demo simulator's local bag copies.
# ReadWriteMany is needed when api replicas > 1; k3s' local-path provisioner only
# offers RWO, so the API runs with RWO + Recreate strategy there. On a cluster with
# an RWX class (EFS, Longhorn, NFS) set storageClassName accordingly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rtdaas-media
  namespace: rtdaas
  labels:
    app.kubernetes.io/part-of: rtdaas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
