# Shared /data volume for the API (SQLite mirror in sqlite mode, trial videos for
# /api/trials/{id}/video) and the demo simulator's local bag copies.
# k3s' local-path provisioner only offers RWO, so the API runs with RWO + Recreate strategy
# (the old pod must release the volume and the DuckDB file before the new one starts).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rtdaas-media
  namespace: rtdaas
  labels:
    app.kubernetes.io/part-of: rtdaas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
