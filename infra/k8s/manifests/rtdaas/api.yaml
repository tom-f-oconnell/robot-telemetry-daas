apiVersion: v1
kind: ServiceAccount
metadata:
  name: rtdaas-api
  namespace: rtdaas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtdaas-api
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: rtdaas-api
    app.kubernetes.io/part-of: rtdaas
spec:
  # One replica: the DuckDB backend keeps its jobs table in a file on the media PVC, and a DuckDB
  # file takes one process (a second replica crash-loops on the lock).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rtdaas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtdaas-api
        app.kubernetes.io/part-of: rtdaas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: rtdaas-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/OWNER/rtdaas-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rtdaas-config
            - configMapRef:
                name: rtdaas-env-overlay
                optional: true
            - secretRef:
                name: rtdaas-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - name: media
              mountPath: /data
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: rtdaas-media
---
apiVersion: v1
kind: Service
metadata:
  name: rtdaas-api
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: rtdaas-api
    app.kubernetes.io/part-of: rtdaas
spec:
  selector:
    app.kubernetes.io/name: rtdaas-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rtdaas-api
  namespace: rtdaas
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    # Range requests for the trial video endpoint pass through untouched.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: rtdaas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rtdaas-api
                port:
                  name: http
