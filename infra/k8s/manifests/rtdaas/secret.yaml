# TEMPLATE — dev-only values. For a real deployment replace this file with a
# SealedSecret / ExternalSecret (see docs/infra/kubernetes.md) and never commit
# real credentials. Keys match the env var names in spec §9; AWS_* duplicates
# the S3 keys for Iceberg's S3FileIO and Hadoop s3a.
apiVersion: v1
kind: Secret
metadata:
  name: rtdaas-secrets
  namespace: rtdaas
  labels:
    app.kubernetes.io/part-of: rtdaas
type: Opaque
stringData:
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AIRFLOW_PASSWORD: airflow
