# Iceberg REST catalog backed by the lake bucket. Metadata lives in the embedded
# SQLite DB of the container by default; mount a PVC (below) so it survives restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iceberg-rest-data
  namespace: rtdaas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: iceberg-rest
    app.kubernetes.io/part-of: rtdaas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iceberg-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iceberg-rest
        app.kubernetes.io/part-of: rtdaas
    spec:
      securityContext:
        fsGroup: 1000  # the image runs as iceberg (1000); make the PVC writable for the SQLite catalog
      containers:
        - name: catalog
          image: tabulario/iceberg-rest:1.6.0
          ports:
            - name: http
              containerPort: 8181
          envFrom:
            - configMapRef:
                name: rtdaas-config
            - configMapRef:
                name: rtdaas-env-overlay
                optional: true
          env:
            - name: CATALOG_WAREHOUSE
              value: s3://rtdaas-lake/warehouse
            - name: CATALOG_IO__IMPL
              value: org.apache.iceberg.aws.s3.S3FileIO
            - name: CATALOG_S3_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: CATALOG_S3_PATH__STYLE__ACCESS
              value: "true"
            - name: CATALOG_URI
              value: jdbc:sqlite:file:/data/iceberg_rest.db
            - name: CATALOG_JDBC_USER
              value: user
            - name: CATALOG_JDBC_PASSWORD
              value: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rtdaas-secrets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rtdaas-secrets
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /v1/config
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iceberg-rest-data
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: iceberg-rest
    app.kubernetes.io/part-of: rtdaas
spec:
  selector:
    app.kubernetes.io/name: iceberg-rest
  ports:
    - name: http
      port: 8181
      targetPort: http
