# Iceberg REST catalog, with its table locations in Postgres and everything else in the lake bucket.
# Not the image's default SQLite file: that takes one writer at a time, and with WAL the server's
# connections could go on serving stale table locations. Coming from the old PVC, see
# scripts/migrate-iceberg-catalog.py.
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-catalog-db
  namespace: rtdaas
stringData:
  # Demo values (change in real deployments).
  POSTGRES_USER: iceberg
  POSTGRES_PASSWORD: iceberg
  POSTGRES_DB: iceberg
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iceberg-catalog-db
  namespace: rtdaas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-catalog-db
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: iceberg-catalog-db
    app.kubernetes.io/part-of: rtdaas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iceberg-catalog-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iceberg-catalog-db
        app.kubernetes.io/part-of: rtdaas
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: iceberg-catalog-db
          env:
            - name: PGDATA  # a subdirectory: a volume's root can hold lost+found, which initdb rejects
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "iceberg", "-d", "iceberg"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iceberg-catalog-db
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-catalog-db
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: iceberg-catalog-db
    app.kubernetes.io/part-of: rtdaas
spec:
  selector:
    app.kubernetes.io/name: iceberg-catalog-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: iceberg-rest
    app.kubernetes.io/part-of: rtdaas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iceberg-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iceberg-rest
        app.kubernetes.io/part-of: rtdaas
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h iceberg-catalog-db -U iceberg; do sleep 2; done"]
      containers:
        - name: catalog
          image: tabulario/iceberg-rest:1.6.0
          ports:
            - name: http
              containerPort: 8181
          envFrom:
            - configMapRef:
                name: rtdaas-config
            - configMapRef:
                name: rtdaas-env-overlay
                optional: true
          env:
            - name: CATALOG_WAREHOUSE
              value: s3://rtdaas-lake/warehouse
            - name: CATALOG_IO__IMPL
              value: org.apache.iceberg.aws.s3.S3FileIO
            - name: CATALOG_S3_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: CATALOG_S3_PATH__STYLE__ACCESS
              value: "true"
            - name: CATALOG_URI
              value: jdbc:postgresql://iceberg-catalog-db:5432/iceberg
            - name: CATALOG_JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: iceberg-catalog-db
                  key: POSTGRES_USER
            - name: CATALOG_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iceberg-catalog-db
                  key: POSTGRES_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rtdaas-secrets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rtdaas-secrets
                  key: S3_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /v1/config
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: rtdaas
  labels:
    app.kubernetes.io/name: iceberg-rest
    app.kubernetes.io/part-of: rtdaas
spec:
  selector:
    app.kubernetes.io/name: iceberg-rest
  ports:
    - name: http
      port: 8181
      targetPort: http
