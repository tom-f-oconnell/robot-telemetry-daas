# minio/minio chart 5.3.x — standalone server used as the S3 endpoint for the
# libvirt environment (on AWS the overlay ConfigMap points everything at real S3).
mode: standalone
replicas: 1

# Pin the same releases as infra/compose/docker-compose.yml. The chart's default quay.io tag
# has been retired upstream (pulls return 401), so always set these explicitly.
image:
  repository: minio/minio
  tag: RELEASE.2024-10-13T13-34-11Z
mcImage:
  repository: minio/mc
  tag: RELEASE.2024-10-08T09-37-26Z

rootUser: minioadmin
rootPassword: minioadmin   # dev only; override via existingSecret in real deployments
# existingSecret: minio-root

persistence:
  enabled: true
  size: 100Gi

resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 2Gi }

buckets:
  - name: rtdaas-raw
    policy: none
    purge: false
    versioning: true
  - name: rtdaas-lake
    policy: none
    purge: false
    versioning: false

users:
  - accessKey: rtdaas
    secretKey: rtdaas-secret-change-me
    policy: readwrite

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

consoleIngress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - minio.rtdaas.local

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kps
