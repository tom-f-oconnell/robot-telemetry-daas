# minio/minio chart 5.3.x — standalone server used as the S3 endpoint for the
# libvirt environment (on AWS the overlay ConfigMap points everything at real S3).
mode: standalone
replicas: 1

# MinIO retired its dated RELEASE.* tags on quay.io and Docker Hub in 2025 (pulls fail with
# 401 / "repository does not exist"), and the chart's default tag is one of them. Track
# `latest` on quay.io (same as infra/compose) and pin by digest once resolved in your registry:
#   image.tag: "latest@sha256:<digest>"
image:
  repository: quay.io/minio/minio
  tag: latest
mcImage:
  repository: quay.io/minio/mc
  tag: latest

rootUser: minioadmin
rootPassword: minioadmin   # dev only; override via existingSecret in real deployments
# existingSecret: minio-root

persistence:
  enabled: true
  size: 100Gi

resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 2Gi }

buckets:
  - name: rtdaas-raw
    policy: none
    purge: false
    versioning: true
  - name: rtdaas-lake
    policy: none
    purge: false
    versioning: false

users:
  - accessKey: rtdaas
    secretKey: rtdaas-secret-change-me
    policy: readwrite

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

consoleIngress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - minio.rtdaas.local

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kps
