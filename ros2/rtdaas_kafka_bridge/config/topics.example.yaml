# Plain topic-mapping file for the kafka_bridge `config_file` parameter. Equivalent to the
# `topics:` parameter tree in bridge.yaml; useful when the mapping is generated by tooling.
#   ros2 run rtdaas_kafka_bridge kafka_bridge --ros-args \
#     -p robot_id:=dv_001 -p kafka_bootstrap:=kafka:9092 \
#     -p schema_registry_url:=http://apicurio:8080/apis/ccompat/v7 \
#     -p config_file:=$(ros2 pkg prefix rtdaas_kafka_bridge)/share/rtdaas_kafka_bridge/config/topics.example.yaml
topics:
  - name: psm1_joint_states
    ros_topic: /dv_001/PSM1/measured_js
    kafka_topic: rtdaas.telemetry.joint_states
    type: sensor_msgs/msg/JointState
    qos: best_effort
  - name: psm2_joint_states
    ros_topic: /dv_001/PSM2/measured_js
    kafka_topic: rtdaas.telemetry.joint_states
    type: sensor_msgs/msg/JointState
    qos: best_effort
  - name: ecm_joint_states
    ros_topic: /dv_001/ECM/measured_js
    kafka_topic: rtdaas.telemetry.joint_states
    type: sensor_msgs/msg/JointState
    qos: best_effort
  - name: psm1_tool_pose
    ros_topic: /dv_001/PSM1/rtdaas/tool_pose
    kafka_topic: rtdaas.telemetry.tool_pose
    type: rtdaas_msgs/msg/ToolPose
  - name: psm2_tool_pose
    ros_topic: /dv_001/PSM2/rtdaas/tool_pose
    kafka_topic: rtdaas.telemetry.tool_pose
    type: rtdaas_msgs/msg/ToolPose
  - name: ecm_tool_pose
    ros_topic: /dv_001/ECM/rtdaas/tool_pose
    kafka_topic: rtdaas.telemetry.tool_pose
    type: rtdaas_msgs/msg/ToolPose
  - name: events
    ros_topic: /dv_001/rtdaas/events
    kafka_topic: rtdaas.telemetry.events
    type: rtdaas_msgs/msg/SystemEvent
    qos: reliable
  - name: heartbeat
    ros_topic: /dv_001/rtdaas/heartbeat
    kafka_topic: rtdaas.telemetry.heartbeat
    type: rtdaas_msgs/msg/Heartbeat
    qos: reliable
